# XcodeGen project. `xcodegen generate` (run from this directory) produces
# LocStreamer.xcodeproj; the .xcodeproj is never committed.
name: LocStreamer
options:
  bundleIdPrefix: dev.viraat
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 3C4383262W
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "2"

targets:
  LocStreamer:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.viraat.locstreamer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: LocStreamer
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: false
      configs:
        # Release archives sign manually with API-key-fetched profiles
        # (fastlane prep_signing); Debug/simulator stays automatic-unsigned.
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: dev.viraat.locstreamer AppStore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LocStreamer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - location
        NSLocationWhenInUseUsageDescription: >-
          LocStreamer records where you are so you can look back at where you
          have been during the day.
        NSLocationAlwaysAndWhenInUseUsageDescription: >-
          Choose "Always" so LocStreamer keeps recording your location while
          the app is in the background. That is the whole point of the app.
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.utilities
